
set  -g default-terminal "screen"
set  -g base-index      0
setw -g pane-base-index 0





set -g status-keys emacs
set -g mode-keys   emacs







set  -g mouse             on
set  -g focus-events      off
setw -g aggressive-resize off
setw -g clock-mode-style  24
set  -s escape-time       10
set  -g history-limit     2000

# ============================================= #
# Load plugins with Home Manager                #
# --------------------------------------------- #

# tmuxplugin-resurrect
# ---------------------

run-shell /nix/store/s7ij43qa357hqdx1k39xvi68m8pkpnvd-tmuxplugin-resurrect-unstable-2022-05-01/share/tmux-plugins/resurrect/resurrect.tmux


# tmuxplugin-continuum
# ---------------------

run-shell /nix/store/5bmqd7hwf7hvafjvg78fv4f8ck9mk8nn-tmuxplugin-continuum-unstable-2022-01-25/share/tmux-plugins/continuum/continuum.tmux

# ============================================= #

source-file /nix/store/z2n7bqsyfxph6m45p23kbngs3ivgzxq6-base16-atelier-seaside.conf

    # fix scrollwheel in LESS / man
    # https://github.com/tmux/tmux/issues/1320#issuecomment-381952082
    bind-key -T root WheelUpPane \
if-shell -Ft= '#{?mouse_any_flag,1,#{pane_in_mode}}' \
  'send -Mt=' \
  'if-shell -t= "#{?alternate_on,true,false} || echo \"#{tmux_commands_with_legacy_scroll}\" | grep -q \"#{pane_current_command}\"" \
    "send -t= Up Up Up" "copy-mode -et="'

    bind-key -T root WheelDownPane \
if-shell -Ft = '#{?pane_in_mode,1,#{mouse_any_flag}}' \
  'send -Mt=' \
  'if-shell -t= "#{?alternate_on,true,false} || echo \"#{tmux_commands_with_legacy_scroll}\" | grep -q \"#{pane_current_command}\"" \
    "send -t= Down Down Down" "send -Mt="'

    # no holes in window count
    set -g renumber-windows on
    # keep first window at left hand
    set -g base-index 1
    set -g pane-base-index 1

    ########################
    # Plugin After
    ########################
    # enable continuum
    set -g @continuum-restore 'on'
    # enable systemd service
    set -g @continuum-boot 'on' 
